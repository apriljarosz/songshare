openapi: 3.1.0
info:
  title: SongShare API
  description: Universal music link sharing service that aggregates songs across streaming platforms
  version: 1.0.0
  contact:
    name: SongShare API Support
    url: https://songshare.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.songshare.dev
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      description: Check API health and service status
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/platforms:
    get:
      summary: Platform health check
      description: Check health status of all configured streaming platforms
      operationId: platformHealthCheck
      tags:
        - System
      responses:
        '200':
          description: Platform health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthResponse'

  /api/v1/songs/resolve:
    post:
      summary: Resolve song from platform URL
      description: Convert a platform-specific URL (Spotify, Apple Music, etc.) into a universal song with cross-platform links
      operationId: resolveSong
      tags:
        - Songs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSongRequest'
            examples:
              spotify:
                summary: Spotify URL
                value:
                  url: "https://open.spotify.com/track/4u7EnebtmKWzUH433cf5Qv"
              apple_music:
                summary: Apple Music URL  
                value:
                  url: "https://music.apple.com/us/album/bohemian-rhapsody/1440650428?i=1440650439"
      responses:
        '200':
          description: Song successfully resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveSongResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    # Request Schemas
    ResolveSongRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Platform-specific song URL
          example: "https://open.spotify.com/track/4u7EnebtmKWzUH433cf5Qv"

    # Response Schemas
    ResolveSongResponse:
      type: object
      required:
        - song
        - platforms
        - universal_link
      properties:
        song:
          $ref: '#/components/schemas/SongMetadata'
        platforms:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlatformLink'
          description: Platform-specific links
          example:
            spotify:
              url: "https://open.spotify.com/track/4u7EnebtmKWzUH433cf5Qv"
              available: true
              platform: "spotify"
            apple_music:
              url: "https://music.apple.com/us/album/bohemian-rhapsody/1440650428?i=1440650439"
              available: true
              platform: "apple_music"
        universal_link:
          type: string
          format: uri
          description: Universal SongShare link
          example: "https://songshare.dev/s/GBUM71505078"

    SongMetadata:
      type: object
      required:
        - id
        - title
        - artists
      properties:
        id:
          type: string
          description: Unique song identifier
          example: "507f1f77bcf86cd799439011"
        title:
          type: string
          description: Song title
          example: "Bohemian Rhapsody"
        artists:
          type: array
          items:
            type: string
          description: List of artists
          example: ["Queen"]
        album:
          type: string
          description: Album name
          example: "A Night at the Opera"
        duration_ms:
          type: integer
          description: Duration in milliseconds
          example: 355000
        release_date:
          type: string
          description: Release date
          example: "1975-10-31"
        isrc:
          type: string
          description: International Standard Recording Code
          example: "GBUM71505078"
        image_url:
          type: string
          format: uri
          description: Album artwork URL
          example: "https://i.scdn.co/image/ab67616d0000b273ce4f1737bc8a646c8c4bd25a"

    PlatformLink:
      type: object
      required:
        - platform
        - url
        - available
      properties:
        platform:
          type: string
          enum: [spotify, apple_music, tidal]
          description: Streaming platform identifier
          example: "spotify"
        url:
          type: string
          format: uri
          description: Platform-specific song URL
          example: "https://open.spotify.com/track/4u7EnebtmKWzUH433cf5Qv"
        available:
          type: boolean
          description: Whether the song is currently available on this platform
          example: true

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          description: Service health status
          example: "healthy"
        timestamp:
          type: integer
          description: Health check timestamp (Unix timestamp)
          example: 1705312200

    PlatformHealthResponse:
      type: object
      required:
        - platforms
        - timestamp
      properties:
        platforms:
          type: object
          additionalProperties:
            oneOf:
              - type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, error]
                  error:
                    type: string
                    description: Error message when status is error
              - type: object
                properties:
                  status:
                    type: string
                    enum: [not_configured]
          description: Health status for each platform
          example:
            spotify:
              status: "healthy"
            apple_music:
              status: "healthy"
            tidal:
              status: "not_configured"
        timestamp:
          type: integer
          description: Health check timestamp (Unix timestamp)
          example: 1705312200

    # Error Schemas
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request body"

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid request body"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Song not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"

tags:
  - name: Songs
    description: Song resolution operations
  - name: System
    description: System health and status endpoints