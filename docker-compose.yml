services:
  mongodb:
    image: mongo:7.0
    container_name: songshare-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: songshare
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/songshare --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songshare-backend
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/songshare
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - APPLE_MUSIC_KEY=${APPLE_MUSIC_KEY}
      - APPLE_MUSIC_KEY_ID=${APPLE_MUSIC_KEY_ID}
      - APPLE_MUSIC_TEAM_ID=${APPLE_MUSIC_TEAM_ID}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
